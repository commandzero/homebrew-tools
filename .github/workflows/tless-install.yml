name: Verify tless installs

on:
  pull_request:
    paths:
      - Formula/tless.rb
      - .github/workflows/tless-install.yml

permissions:
  contents: read

jobs:
  install:
    name: Tless install / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Set up candidate Homebrew tap
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - name: Check formula style
        run: brew style Formula/tless.rb
      - name: Install and test published release archive
        run: |
          brew install commandzero/tools/tless
          brew test commandzero/tools/tless
          brew uninstall commandzero/tools/tless
